name: NephroDesk AI Pro — CI Tests & Free GitHub Pages Deploy

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  verify-and-test:
    name: Run Clinical Unit, RBAC & Security Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 18 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Run automated verification suite (16/16 tests)
        run: node --test tests/run_all_tests.js

      - name: Verify WebApp JavaScript syntax
        run: |
          node -e '
            const fs = require("fs");
            const html = fs.readFileSync("public/nephrodesk-ai-pro.html", "utf8");
            const match = html.match(/<script>([\s\S]*?)<\/script>/);
            if (!match) process.exit(1);
            fs.writeFileSync("/tmp/check.js", match[1]);
          '
          node --check /tmp/check.js

  deploy-github-pages:
    name: Deploy Interactive WebApp to GitHub Pages
    needs: verify-and-test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare public directory for GitHub Pages
        run: |
          cp public/nephrodesk-ai-pro.html public/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static WebApp artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./public"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
